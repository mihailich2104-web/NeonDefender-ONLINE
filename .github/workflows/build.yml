name: Build Neon Defender Setup.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe with PyInstaller
        shell: bash
        run: |
          ADD_DATA=""
          if [ -f fnt_dotumche.ttf ]; then
            ADD_DATA="--add-data fnt_dotumche.ttf;."
          fi
          if [ -d locales ]; then
            ADD_DATA="$ADD_DATA --add-data locales;locales"
          fi
          if [ -f icon.ico ]; then
            pyinstaller --onefile --noconsole --name NeonDefender --icon=icon.ico $ADD_DATA game.py
          else
            echo "icon.ico not found, building without custom icon"
            pyinstaller --onefile --noconsole --name NeonDefender $ADD_DATA game.py
          fi

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Download unofficial Serbian .isl files
        shell: bash
        run: |
          ISL_DIR="/c/Program Files (x86)/Inno Setup 6/Languages"
          curl -sL -o "$ISL_DIR/SerbianCyrillic.isl" "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/SerbianCyrillic.isl" || true
          curl -sL -o "$ISL_DIR/SerbianLatin.isl" "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/SerbianLatin.isl" || true

      - name: Write Inno Setup script (multi-language, modern wizard)
        shell: bash
        run: |
          if [ -f icon.ico ]; then
            ICON_LINE="SetupIconFile=icon.ico"
            ICON_FILE_LINE='Source: "icon.ico"; DestDir: "{app}"; Flags: ignoreversion'
            ICON_ARG='; IconFilename: "{app}\icon.ico"'
          else
            ICON_LINE=""
            ICON_FILE_LINE=""
            ICON_ARG=""
          fi
          ISL_DIR="/c/Program Files (x86)/Inno Setup 6/Languages"
          SERBIAN_LINE=""
          if [ -f "$ISL_DIR/SerbianCyrillic.isl" ]; then
            SERBIAN_LINE='Name: "serbiancyrillic"; MessagesFile: "compiler:Languages\SerbianCyrillic.isl"'
          fi
          cat > installer.iss << EOF
          [Setup]
          AppName=Neon Defender
          AppVersion=2.0.0
          AppPublisher=Neon Defender
          DefaultDirName={autopf}\NeonDefender
          DefaultGroupName=Neon Defender
          OutputBaseFilename=Setup
          OutputDir=dist_installer
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          DisableWelcomePage=no
          ArchitecturesInstallIn64BitMode=x64compatible
          MinVersion=6.1sp1
          $ICON_LINE

          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          Name: "ukrainian"; MessagesFile: "compiler:Languages\Ukrainian.isl"
          Name: "polish"; MessagesFile: "compiler:Languages\Polish.isl"
          Name: "french"; MessagesFile: "compiler:Languages\French.isl"
          Name: "spanish"; MessagesFile: "compiler:Languages\Spanish.isl"
          Name: "italian"; MessagesFile: "compiler:Languages\Italian.isl"
          $SERBIAN_LINE

          [Files]
          Source: "dist\NeonDefender.exe"; DestDir: "{app}"; Flags: ignoreversion
          $ICON_FILE_LINE

          [Icons]
          Name: "{group}\Neon Defender"; Filename: "{app}\NeonDefender.exe"$ICON_ARG
          Name: "{autodesktop}\Neon Defender"; Filename: "{app}\NeonDefender.exe"; Tasks: desktopicon$ICON_ARG

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Run]
          Filename: "{app}\NeonDefender.exe"; Description: "{cm:LaunchProgram,Neon Defender}"; Flags: nowait postinstall skipifsilent
          EOF

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Zip Setup.exe
        shell: bash
        run: |
          mkdir -p dist_zip
          cp dist_installer/Setup.exe dist_zip/Setup.exe
          cd dist_zip
          powershell -Command "Compress-Archive -Path Setup.exe -DestinationPath NeonDefender-Setup.zip -Force"

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: NeonDefender-Setup
          path: dist_installer/Setup.exe

      - name: Upload Setup.zip
        uses: actions/upload-artifact@v4
        with:
          name: NeonDefender-Setup-Zip
          path: dist_zip/NeonDefender-Setup.zip
